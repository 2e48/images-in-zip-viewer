<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta content="IE=edge" http-equiv="X-UA-Compatible" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>ZIP Image Metadata Viewer</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
        rel="stylesheet" />

  <!-- Custom CSS -->
  <link href="main.css" rel="stylesheet" />

  <!-- JS Libraries -->
  <script defer src="js/lib/jszip.min.js"></script>
  <script defer src="js/lib/exifr.full.umd.js"></script>
  <script defer src="js/index.js"></script>
</head>
<body>
  <div class="container mt-4">
    <h3>Choose ZIP file(s)</h3>
    <label class="form-label" for="file">Upload one or more ZIP files</label>
    <input accept=".zip" class="form-control" id="file" multiple name="file" type="file" />

    <div class="accordion mt-4" id="result"></div>
  </div>

  <!-- Modal -->
  <div aria-hidden="true" class="modal fade modal-fullscreen-custom" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-body">
          <div class="row g-3">
            <!-- Image Preview -->
            <div class="col-md-7 text-center modal-image-col">
              <img alt="Preview" class="img-fluid" id="modalImage" />
            </div>

            <!-- Metadata -->
            <div class="col-md-5">
              <div class="d-flex align-items-start justify-content-between gap-2">
                <h5 class="mb-1" id="modalTitle">Image Details</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>

              <p class="modal-filename"><strong>File:</strong> <span id="modalFilename">N/A</span></p>

              <div class="d-flex flex-wrap gap-2 mb-3">
                <button class="btn btn-primary btn-sm" id="downloadBtn" type="button">
                  Download Image
                </button>
              </div>

              <div id="modalMetadata"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
